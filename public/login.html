<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in — BRL Command Center</title>
<link rel="icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--red:#C8102E;--red-d:#A00D25;--ink:#141414;--grey:#5F5F5F;--line:#E6E6E6;--line-2:#D4D4D4;--page:#F6F6F6}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',Arial,sans-serif;background:var(--page);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border:1px solid var(--line);border-top:3px solid var(--red);padding:34px 34px 30px;width:100%;max-width:400px}
.logo{height:40px;background:url(/brand.png) no-repeat left center/auto 40px;margin-bottom:26px}
.kick{font-size:11px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--red);margin-bottom:10px}
h1{font-weight:900;font-size:26px;line-height:1.05;letter-spacing:-.02em;text-transform:uppercase;margin-bottom:6px}
h1 em{font-style:normal;color:var(--red)}
p.sub{color:var(--grey);font-size:12.5px;margin-bottom:22px}
label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--ink);margin-bottom:6px;margin-top:16px}
input{width:100%;font-family:'Inter';font-size:14px;padding:11px 12px;border:1px solid var(--line-2);background:#fff;color:var(--ink)}
input:focus{outline:2px solid var(--red);outline-offset:-1px}
button{width:100%;margin-top:22px;background:var(--red);color:#fff;border:0;padding:13px;font-size:11.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;cursor:pointer}
button:hover{background:var(--red-d)}
.err{background:#FCE8EB;color:var(--red);border-left:3px solid var(--red);padding:9px 12px;font-size:12.5px;margin-top:16px;display:none}
.err.show{display:block}
.foot{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:#8A8A8A;font-weight:700}
</style>
</head>
<body>
<div class="card">
  <div class="logo"></div>
  <div class="kick">Command Center</div>
  <h1>Every call.<br>Every promise.<br><em>On one screen.</em></h1>
  <p class="sub">Sign in with your Best Roadways account.</p>
  <form id="f" method="POST" action="/login">
    <label for="u">Username</label>
    <input id="u" name="username" autocomplete="username" required autofocus>
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <div class="err" id="err">Incorrect username or password.</div>
    <button type="submit">Sign in →</button>
  </form>
  <div class="foot"><span>Best Roadways Limited</span><span>Built, not brokered.</span></div>
</div>
<script>
if (new URLSearchParams(location.search).get('error')) {
  document.getElementById('err').classList.add('show');
}
</script>
</body>
</html>
